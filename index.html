<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Top10th | Master Your Boards</title>
    
    <meta name="description" content="Prepare for 10th Boards with 75 unique MCQs, XP rewards, and global rankings." />
    <meta name="google-site-verification" content="QI_lpqlDIVQ921ejeY9zp8mcxADhunyisoW8wQeBZ2k" />
    <meta property="og:title" content="Top10th - Smart Study Platform" />
    <meta property="og:image" content="https://yourdomain.com/og-image.jpg" />

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#38bdf8', secondary: '#7c3aed', dark: '#020617' }
                }
            }
        }
    </script>

    <style>
        body { background: #020617; color: white; font-family: 'Plus Jakarta Sans', sans-serif; padding-bottom: env(safe-area-inset-bottom); }
        .glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .gradient-text { background: linear-gradient(135deg, #38bdf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .btn-active { border-color: #38bdf8; background: rgba(56, 189, 248, 0.1); }
        .locked { pointer-events: none; opacity: 0.7; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-in { animation: fadeIn 0.4s ease forwards; }
    </style>
</head>
<body class="min-h-screen">

    <nav class="fixed top-0 w-full z-50 glass px-6 py-4 flex justify-between items-center">
        <h1 class="text-xl font-extrabold gradient-text tracking-tight">Top10th</h1>
        <div id="nav-user" class="hidden flex items-center gap-4">
            <span id="display-name" class="text-xs font-bold text-gray-400"></span>
            <button onclick="handleLogout()" class="text-[10px] text-red-400 border border-red-500/20 px-3 py-1 rounded-full uppercase">Logout</button>
        </div>
    </nav>

    <section id="auth-view" class="pt-32 px-6 max-w-sm mx-auto space-y-6">
        <div class="glass p-8 rounded-[32px] text-center">
            <h2 class="text-3xl font-black mb-4">Start Learning</h2>
            <div id="auth-inputs" class="space-y-3 mb-6">
                <input id="auth-email" type="email" placeholder="Email" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-primary transition" />
                <input id="auth-pass" type="password" placeholder="Password" class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-primary transition" />
            </div>
            <div class="flex flex-col gap-3">
                <button onclick="handleAuth('login')" id="btn-login" class="w-full py-4 bg-primary text-dark font-bold rounded-2xl hover:opacity-90">Login</button>
                <button onclick="handleAuth('signup')" class="text-xs text-gray-500 underline">Don't have an account? Sign up</button>
                <div class="flex items-center gap-2 text-gray-700 py-2"><hr class="flex-1 border-white/5">OR<hr class="flex-1 border-white/5"></div>
                <button onclick="enterGuest()" class="w-full py-4 border border-white/10 rounded-2xl font-semibold hover:bg-white/5">Guest Mode</button>
            </div>
        </div>
    </section>

    <main id="game-view" class="hidden pt-28 px-4 max-w-5xl mx-auto space-y-6">
        <div class="grid grid-cols-2 md:grid-cols-4 gap-3">
            <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500 uppercase">XP</p><h3 id="xp-val" class="text-xl font-bold">0</h3></div>
            <div id="rank-card" class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500 uppercase">Global Rank</p><h3 id="rank-val" class="text-xl font-bold text-primary">#--</h3></div>
            <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500 uppercase">Accuracy</p><h3 id="acc-val" class="text-xl font-bold">0%</h3></div>
            <div class="glass p-4 rounded-2xl text-center"><p class="text-[10px] text-gray-500 uppercase">Streak</p><h3 id="streak-val" class="text-xl font-bold text-orange-400">0 🔥</h3></div>
        </div>

        <div class="flex gap-2 overflow-x-auto no-scrollbar pb-2">
            <button onclick="setFilter('Math')" class="f-btn glass px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">Math</button>
            <button onclick="setFilter('Science')" class="f-btn glass px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">Science</button>
            <button onclick="setFilter('English')" class="f-btn glass px-6 py-2 rounded-full text-xs font-bold whitespace-nowrap">English</button>
        </div>

        <div id="quiz-container" class="glass rounded-[40px] p-8 md:p-12 relative min-h-[400px]">
            <div id="quiz-ui">
                <div class="flex justify-between items-center mb-6">
                    <span id="q-progress-text" class="text-[10px] font-bold text-gray-500 uppercase">Q 1/25</span>
                    <span class="text-sm font-bold text-primary tabular-nums">⏳ <span id="timer-sec">30</span>s</span>
                </div>
                <div class="h-1 w-full bg-white/5 rounded-full mb-10 overflow-hidden">
                    <div id="q-progress-bar" class="h-full bg-primary transition-all duration-500" style="width: 4%"></div>
                </div>
                <h2 id="q-text" class="text-xl md:text-2xl font-bold mb-8"></h2>
                <div id="option-grid" class="grid gap-3"></div>
            </div>

            <div id="result-ui" class="hidden text-center py-10 animate-in">
                <h2 class="text-4xl font-black mb-2 gradient-text">Subject Clear!</h2>
                <p class="text-gray-400 mb-8">You've completed the current set.</p>
                <div class="grid grid-cols-2 gap-4 mb-8">
                    <div class="p-4 glass rounded-2xl"><p class="text-xs">Correct</p><h4 id="res-correct" class="text-2xl font-bold text-green-400">0</h4></div>
                    <div class="p-4 glass rounded-2xl"><p class="text-xs">XP Earned</p><h4 id="res-xp" class="text-2xl font-bold text-primary">0</h4></div>
                </div>
                <button onclick="location.reload()" class="w-full py-4 bg-white text-black font-black rounded-2xl">Play Next Topic</button>
            </div>
        </div>
    </main>

    <div id="toast-bin" class="fixed bottom-6 right-6 z-[9999] flex flex-col gap-2"></div>

    <script type="module">
        import { createClient } from 'https://esm.sh/@supabase/supabase-js@2'
        const supabase = createClient('https://ncmtvfamysifjjkcszuw.supabase.co', 'sb_publishable_Z4pmzCeIXWNxnXuseaP8HQ_LJTLnY1P')

        // --- DATABASE: THE REAL 75 (Shortened for brevity but indexed 1-75) ---
        const DB = [
            ...Array.from({length: 25}, (_, i) => ({ id: i+1, sub: 'Math', q: `Math Question ${i+1}?`, opts: ['A','B','C','D'], ans: 'A' })),
            ...Array.from({length: 25}, (_, i) => ({ id: i+26, sub: 'Science', q: `Science Question ${i+1}?`, opts: ['A','B','C','D'], ans: 'A' })),
            ...Array.from({length: 25}, (_, i) => ({ id: i+51, sub: 'English', q: `English Question ${i+1}?`, opts: ['A','B','C','D'], ans: 'A' }))
        ];

        let state = { xp: 0, streak: 0, solved: 0, correct: 0, user: null, isGuest: false };
        let activeQ = [], curIdx = 0, timerObj = null, timeLeft = 30, isAnswering = false;

        // --- UTILS ---
        const safeJSON = (key, fallback) => {
            try { return JSON.parse(localStorage.getItem(key)) || fallback; }
            catch(e) { return fallback; }
        }

        const toast = (m, err=false) => {
            const t = document.createElement('div');
            t.className = `p-4 rounded-xl text-xs font-bold text-white shadow-2xl animate-in ${err ? 'bg-red-600' : 'bg-green-600'}`;
            t.innerText = m;
            document.getElementById('toast-bin').appendChild(t);
            setTimeout(() => t.remove(), 3000);
        }

        // --- AUTH FLOW ---
        window.handleAuth = async (type) => {
            const email = document.getElementById('auth-email').value;
            const password = document.getElementById('auth-pass').value;
            if(!email || password.length < 6) return toast("Valid email & 6+ chars required", true);

            try {
                const { data, error } = type === 'login' 
                    ? await supabase.auth.signInWithPassword({ email, password })
                    : await supabase.auth.signUp({ email, password });
                
                if(error) throw error;
                if(type === 'signup') {
                    await supabase.from('users').insert([{ id: data.user.id, name: email.split('@')[0], xp: 0 }]);
                }
                location.reload();
            } catch (e) { toast(e.message, true); }
        }

        window.enterGuest = () => {
            state.isGuest = true;
            state = { ...state, ...safeJSON('t10_guest', {}) };
            initGame();
        }

        window.handleLogout = async () => {
            await supabase.auth.signOut();
            localStorage.removeItem('t10_guest');
            location.reload();
        }

        // --- GAME LOGIC ---
        async function initGame() {
            document.getElementById('auth-view').classList.add('hidden');
            document.getElementById('game-view').classList.remove('hidden');
            if(state.user) {
                document.getElementById('nav-user').classList.remove('hidden');
                document.getElementById('display-name').innerText = state.user.email.split('@')[0];
            }
            setFilter('Math');
            syncStats();
            updateRank();
        }

        window.setFilter = (sub) => {
            activeQ = DB.filter(q => q.sub === sub).sort(() => Math.random() - 0.5);
            curIdx = 0;
            state.correct = 0; // Reset session correct count
            document.getElementById('quiz-ui').classList.remove('hidden');
            document.getElementById('result-ui').classList.add('hidden');
            renderQ();
            startTimer();
        }

        function renderQ() {
            if(curIdx >= activeQ.length) return showResults();
            isAnswering = false;
            const q = activeQ[curIdx];
            document.getElementById('q-text').innerText = q.q;
            document.getElementById('q-progress-text').innerText = `Q ${curIdx + 1}/${activeQ.length}`;
            document.getElementById('q-progress-bar').style.width = `${((curIdx+1)/activeQ.length)*100}%`;
            
            const grid = document.getElementById('option-grid');
            grid.innerHTML = '';
            q.opts.forEach(opt => {
                const b = document.createElement('button');
                b.className = "p-5 glass rounded-2xl text-left hover:border-primary transition font-medium";
                b.innerText = opt;
                b.onclick = () => checkAns(opt);
                grid.appendChild(b);
            });
            timeLeft = 30;
        }

        async function checkAns(ans) {
            if(isAnswering) return;
            isAnswering = true;
            const q = activeQ[curIdx];
            state.solved++;

            if(ans === q.ans) {
                state.xp += 10; state.streak++; state.correct++;
                toast("+10 XP");
                confetti({ particleCount: 30, spread: 50, origin: { y: 0.8 } });
            } else {
                state.streak = 0;
                toast("Wrong Answer", true);
            }

            syncStats();
            saveData();
            curIdx++;
            setTimeout(renderQ, 1000);
        }

        function showResults() {
            document.getElementById('quiz-ui').classList.add('hidden');
            const resUI = document.getElementById('result-ui');
            resUI.classList.remove('hidden');
            document.getElementById('res-correct').innerText = state.correct;
            document.getElementById('res-xp').innerText = state.correct * 10;
            clearInterval(timerObj);
        }

        function startTimer() {
            if(timerObj) clearInterval(timerObj);
            timerObj = setInterval(() => {
                timeLeft--;
                document.getElementById('timer-sec').innerText = timeLeft;
                if(timeLeft <= 0) { curIdx++; renderQ(); }
            }, 1000);
        }

        function syncStats() {
            document.getElementById('xp-val').innerText = state.xp;
            document.getElementById('streak-val').innerText = `${state.streak} 🔥`;
            const acc = state.solved === 0 ? 0 : Math.round((state.xp / (state.solved * 10)) * 100);
            document.getElementById('acc-val').innerText = `${Math.min(acc, 100)}%`;
        }

        async function updateRank() {
            if(state.isGuest) return;
            try {
                const { data } = await supabase.from('users').select('xp').order('xp', {ascending: false});
                const myRank = data.findIndex(u => u.xp <= state.xp) + 1;
                document.getElementById('rank-val').innerText = `#${myRank || '--'}`;
            } catch(e) {}
        }

        async function saveData() {
            if(state.isGuest) localStorage.setItem('t10_guest', JSON.stringify(state));
            else {
                await supabase.from('users').update({ xp: state.xp }).eq('id', state.user.id);
            }
        }

        // --- SESSION CHECK ---
        const checkSession = async () => {
            const { data: { session } } = await supabase.auth.getSession();
            if(session) {
                const { data } = await supabase.from('users').select('*').eq('id', session.user.id).single();
                state = { ...state, xp: data.xp, user: session.user };
                initGame();
            }
        };
        checkSession();
    </script>
</body>
</html>
