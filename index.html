<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Top10th Pro | Arman Sir</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #020617; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(255, 255, 255, 0.02); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.08); }
        input::placeholder { color: rgba(255,255,255,0.3); }
    </style>
</head>
<body class="p-4">

    <section id="auth-view" class="min-h-screen flex items-center justify-center">
        <div class="glass p-8 rounded-[40px] w-full max-w-sm text-center space-y-4">
            <h1 class="text-4xl font-black text-sky-400 mb-2">TOP10TH</h1>
            <p class="text-gray-500 text-sm mb-6">Apna account banayein</p>
            
            <input id="user-name" type="text" placeholder="Pura Naam Likhein" 
                class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-sky-500 transition">
            
            <input id="email" type="email" placeholder="Email Address" 
                class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-sky-500 transition">
            
            <input id="pass" type="password" placeholder="Password (6+ Char)" 
                class="w-full bg-white/5 border border-white/10 p-4 rounded-2xl outline-none focus:border-sky-500 transition">
            
            <button id="loginBtn" class="w-full py-4 bg-sky-500 text-black font-black rounded-2xl hover:scale-[0.98] active:scale-95 transition">
                Chalu Karein 🚀
            </button>
        </div>
    </section>

    <main id="app-view" class="hidden max-w-2xl mx-auto pt-12 space-y-6">
        
        <div class="flex justify-between items-end px-2">
            <div>
                <p class="text-[10px] text-gray-500 font-black uppercase tracking-tighter">Student</p>
                <h2 id="display-name" class="text-xl font-black text-sky-400">---</h2>
            </div>
            <div class="text-right">
                <p class="text-[10px] text-gray-500 font-black uppercase tracking-tighter">My XP 🏆</p>
                <h3 id="high-score" class="text-2xl font-black text-yellow-500">0</h3>
            </div>
        </div>

        <div id="quiz-box" class="glass p-8 rounded-[40px] relative overflow-hidden">
            <div class="flex justify-between items-center mb-8">
                <span id="q-idx" class="text-[10px] text-gray-500 font-bold uppercase tracking-widest">Question 1/75</span>
                <span id="streak-tag" class="bg-orange-500/20 text-orange-500 px-4 py-1.5 rounded-full text-[10px] font-black border border-orange-500/20">
                    STREAK: 0 🔥
                </span>
            </div>

            <h2 id="q-text" class="text-2xl font-bold mb-10 leading-tight italic">Sawal load ho raha hai...</h2>
            
            <div id="options" class="grid grid-cols-1 gap-4">
                </div>
        </div>

    </main>

    <script type="module" src="app.js"></script>
</body>
</html>
