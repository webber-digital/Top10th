<!-- index.html -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  />

  <title>Top10th | Board Prep</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link
    href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  />

  <style>
    *{
      margin:0;
      padding:0;
      box-sizing:border-box;
    }

    body{
      font-family:'Plus Jakarta Sans',sans-serif;
      background:#020617;
      color:white;
      overflow-x:hidden;
    }

    body::before{
      content:'';
      position:fixed;
      inset:0;
      background:
      radial-gradient(circle at top left,#0ea5e933,transparent 30%),
      radial-gradient(circle at bottom right,#8b5cf633,transparent 30%);
      z-index:-1;
    }

    .glass{
      background:rgba(255,255,255,0.04);
      border:1px solid rgba(255,255,255,0.08);
      backdrop-filter:blur(16px);
      -webkit-backdrop-filter:blur(16px);
    }

    .input{
      width:100%;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      padding:16px;
      border-radius:20px;
      outline:none;
      color:white;
      transition:0.25s;
      font-weight:600;
    }

    .input:focus{
      border-color:#38bdf8;
      box-shadow:0 0 0 4px rgba(56,189,248,0.1);
    }

    .input::placeholder{
      color:#64748b;
    }

    .primary-btn{
      width:100%;
      padding:16px;
      border-radius:20px;
      border:none;
      background:linear-gradient(135deg,#38bdf8,#6366f1);
      color:white;
      font-weight:800;
      cursor:pointer;
      transition:0.25s;
    }

    .primary-btn:hover{
      transform:translateY(-2px);
    }

    .toggle-btn{
      flex:1;
      padding:12px;
      border-radius:16px;
      border:none;
      font-weight:800;
      cursor:pointer;
      transition:0.25s;
      background:transparent;
      color:#94a3b8;
    }

    .toggle-active{
      background:#0ea5e9;
      color:white;
    }

    .option-btn{
      width:100%;
      padding:18px;
      border-radius:24px;
      text-align:left;
      font-weight:700;
      background:rgba(255,255,255,0.03);
      border:1px solid rgba(255,255,255,0.08);
      transition:0.25s;
    }

    .option-btn:hover{
      border-color:#38bdf8;
      transform:translateY(-2px);
    }

    .correct{
      border-color:#22c55e !important;
      background:rgba(34,197,94,0.1) !important;
    }

    .wrong{
      border-color:#ef4444 !important;
      background:rgba(239,68,68,0.1) !important;
    }

    .fade{
      animation:fade .3s ease;
    }

    @keyframes fade{
      from{
        opacity:0;
        transform:translateY(10px);
      }
      to{
        opacity:1;
        transform:translateY(0);
      }
    }
  </style>
</head>

<body>

  <!-- AUTH -->
  <section
    id="auth-view"
    class="min-h-screen flex items-center justify-center p-5"
  >

    <div
      class="glass w-full max-w-md rounded-[40px] p-8 space-y-6 fade"
    >

      <div class="text-center">
        <h1 class="text-5xl font-black text-sky-400">
          TOP10TH
        </h1>

        <p class="text-slate-400 mt-2">
          Board Exam Preparation Platform
        </p>
      </div>

      <!-- TOGGLE -->
      <div class="glass p-1 rounded-2xl flex">
        <button
          id="login-tab"
          class="toggle-btn toggle-active"
        >
          Login
        </button>

        <button
          id="signup-tab"
          class="toggle-btn"
        >
          Create Account
        </button>
      </div>

      <!-- LOGIN -->
      <div id="login-box" class="space-y-4">

        <input
          id="login-email"
          type="email"
          placeholder="Email Address"
          class="input"
        />

        <input
          id="login-password"
          type="password"
          placeholder="Password"
          class="input"
        />

        <button
          id="login-btn"
          class="primary-btn"
        >
          Login →
        </button>

      </div>

      <!-- SIGNUP -->
      <div
        id="signup-box"
        class="space-y-4 hidden"
      >

        <!-- STEP 1 -->
        <div id="signup-step-1" class="space-y-4">

          <input
            id="signup-email"
            type="email"
            placeholder="Email Address"
            class="input"
          />

          <input
            id="signup-password"
            type="password"
            placeholder="Password"
            class="input"
          />

          <button
            id="continue-btn"
            class="primary-btn"
          >
            Continue →
          </button>

        </div>

        <!-- STEP 2 -->
        <div
          id="signup-step-2"
          class="space-y-4 hidden"
        >

          <input
            id="signup-name"
            type="text"
            placeholder="What should we call you?"
            class="input"
          />

          <button
            id="signup-btn"
            class="primary-btn"
          >
            Create My Account 🚀
          </button>

        </div>

      </div>

    </div>

  </section>

  <!-- APP -->
  <main
    id="app-view"
    class="hidden max-w-3xl mx-auto px-4 py-8 space-y-6"
  >

    <!-- TOP -->
    <div class="flex justify-between items-center">

      <div>
        <p class="text-xs text-slate-500 font-bold uppercase">
          Welcome Back
        </p>

        <h2
          id="display-name"
          class="text-2xl font-black text-sky-400"
        >
          USER
        </h2>
      </div>

      <button
        id="logout-btn"
        class="glass px-5 py-3 rounded-2xl text-red-400 font-bold"
      >
        Logout
      </button>

    </div>

    <!-- STATS -->
    <div class="grid grid-cols-3 gap-3">

      <div class="glass p-5 rounded-3xl text-center">
        <p class="text-xs text-slate-500 font-bold">
          XP
        </p>

        <h2
          id="xp"
          class="text-3xl font-black text-yellow-400"
        >
          0
        </h2>
      </div>

      <div class="glass p-5 rounded-3xl text-center">
        <p class="text-xs text-slate-500 font-bold">
          STREAK
        </p>

        <h2
          id="streak"
          class="text-3xl font-black text-orange-400"
        >
          0
        </h2>
      </div>

      <div class="glass p-5 rounded-3xl text-center">
        <p class="text-xs text-slate-500 font-bold">
          PREMIUM
        </p>

        <h2
          id="premium-tag"
          class="text-lg font-black text-sky-400"
        >
          FREE
        </h2>
      </div>

    </div>

    <!-- QUIZ -->
    <section
      id="quiz-box"
      class="glass rounded-[40px] p-6 md:p-8"
    >

      <div class="flex justify-between mb-8">

        <span
          id="question-count"
          class="text-xs text-slate-500 font-bold uppercase"
        >
          Question 1/75
        </span>

        <span
          id="subject-tag"
          class="text-xs bg-sky-500/10 text-sky-400 px-4 py-2 rounded-full font-black"
        >
          Math
        </span>

      </div>

      <h2
        id="question"
        class="text-2xl font-bold leading-relaxed mb-8"
      >
        Loading...
      </h2>

      <div
        id="options"
        class="grid gap-4"
      ></div>

    </section>

  </main>

  <script type="module" src="./app.js"></script>

</body>
</html>
