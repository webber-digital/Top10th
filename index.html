<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Top10th | Smart Learning</title>

<script src="https://cdn.tailwindcss.com"></script>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:'Inter',sans-serif;
background:#050816;
color:white;
overflow-x:hidden;
}

.bg-grid{
position:fixed;
inset:0;
background-image:
linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
background-size:40px 40px;
z-index:-3;
}

.glass{
background:rgba(255,255,255,0.06);
backdrop-filter:blur(18px);
border:1px solid rgba(255,255,255,0.08);
box-shadow:0 0 25px rgba(56,189,248,0.08);
}

.gradient{
background:linear-gradient(90deg,#38BDF8,#7C3AED);
-webkit-background-clip:text;
-webkit-text-fill-color:transparent;
}

.btn-main{
background:linear-gradient(90deg,#38BDF8,#7C3AED);
padding:14px 28px;
border-radius:999px;
font-weight:600;
transition:0.3s;
border:none;
cursor:pointer;
}

.btn-main:hover{
transform:scale(1.05);
}

.btn-outline{
padding:14px 28px;
border-radius:999px;
border:1px solid rgba(255,255,255,0.15);
background:rgba(255,255,255,0.03);
cursor:pointer;
}

.answer{
transition:0.3s;
cursor:pointer;
}

.answer:hover{
transform:scale(1.02);
background:rgba(255,255,255,0.1);
}

.progress{
height:8px;
border-radius:999px;
background:rgba(255,255,255,0.08);
overflow:hidden;
}

.progress div{
height:100%;
background:linear-gradient(90deg,#38BDF8,#7C3AED);
}

input,select{
outline:none;
}

</style>
</head>

<body>

<div class="bg-grid"></div>

<!-- NAVBAR -->

<nav class="fixed top-0 w-full z-50 glass px-6 py-4 flex justify-between items-center">

<h1 class="text-2xl font-bold gradient">
Top10th
</h1>

<div class="flex items-center gap-3">

<select id="languageToggle"
class="bg-black/40 border border-white/10 px-4 py-2 rounded-xl">

<option value="en">
English
</option>

<option value="hi">
हिंदी
</option>

</select>

<p id="navUser" class="text-sm text-gray-300">
Guest
</p>

<button onclick="logout()" class="btn-outline text-sm">
Logout
</button>

</div>

</nav>

<!-- AUTH -->

<section id="authSection"
class="min-h-screen flex items-center justify-center px-6">

<div class="glass max-w-md w-full rounded-3xl p-8">

<h2 class="text-4xl font-bold mb-4">
Welcome to <span class="gradient">Top10th</span>
</h2>

<p class="text-gray-400 mb-8">
Study smarter and save your progress.
</p>

<div class="space-y-4">

<input
id="name"
type="text"
placeholder="Your Name"
class="w-full p-4 rounded-2xl bg-black/30 border border-white/10"
/>

<input
id="email"
type="email"
placeholder="Email"
class="w-full p-4 rounded-2xl bg-black/30 border border-white/10"
/>

<input
id="password"
type="password"
placeholder="Password"
class="w-full p-4 rounded-2xl bg-black/30 border border-white/10"
/>

<button onclick="signup()" class="btn-main w-full">
Create Account
</button>

<button onclick="login()" class="btn-outline w-full">
Login
</button>

</div>

</div>

</section>

<!-- APP -->

<div id="app" class="hidden">

<!-- HERO -->

<section class="min-h-screen flex flex-col justify-center items-center text-center px-6">

<div class="glass px-4 py-2 rounded-full text-sm mb-6">
🔥 Modern Learning Platform
</div>

<h1 class="text-6xl font-extrabold mb-6">
Study <span class="gradient">Smarter</span>
</h1>

<p class="text-gray-400 max-w-2xl mb-10 text-lg">
75 Important Questions with bilingual learning system.
</p>

<div class="grid md:grid-cols-4 gap-6 mt-10 w-full max-w-6xl">

<div class="glass rounded-3xl p-6">
<p class="text-gray-400 mb-2">XP</p>
<h2 id="xp" class="text-4xl font-bold gradient">
0
</h2>
</div>

<div class="glass rounded-3xl p-6">
<p class="text-gray-400 mb-2">Solved</p>
<h2 id="solved" class="text-4xl font-bold gradient">
0
</h2>
</div>

<div class="glass rounded-3xl p-6">
<p class="text-gray-400 mb-2">Accuracy</p>
<h2 id="accuracy" class="text-4xl font-bold gradient">
0%
</h2>
</div>

<div class="glass rounded-3xl p-6">
<p class="text-gray-400 mb-2">Streak</p>
<h2 id="streak" class="text-4xl font-bold gradient">
1 🔥
</h2>
</div>

</div>

</section>

<!-- FILTERS -->

<section class="px-6">

<div class="flex flex-wrap justify-center gap-4 mb-12">

<button onclick="filterQuestions('All')" class="btn-main">
All
</button>

<button onclick="filterQuestions('Math')" class="btn-outline">
Math
</button>

<button onclick="filterQuestions('Science')" class="btn-outline">
Science
</button>

<button onclick="filterQuestions('English')" class="btn-outline">
English
</button>

</div>

</section>

<!-- QUIZ -->

<section class="pb-24 px-6">

<div class="glass max-w-3xl mx-auto rounded-3xl p-8">

<div class="flex justify-between mb-6">

<p id="questionCount">
Question 1/75
</p>

<p>
⏳ <span id="timer">30</span>s
</p>

</div>

<div class="progress mb-10">
<div id="questionProgress" style="width:0%"></div>
</div>

<h2 id="questionText" class="text-3xl font-bold mb-8">
Loading...
</h2>

<div id="answers" class="space-y-4"></div>

</div>

</section>

<!-- LEADERBOARD -->

<section class="pb-24 px-6">

<h2 class="text-5xl font-bold text-center mb-16">
Top <span class="gradient">Rankers</span>
</h2>

<div id="leaderboard"
class="max-w-4xl mx-auto space-y-6"></div>

</section>

</div>

<script type="module">

/* FIREBASE */

import { initializeApp }
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-app.js";

import {
getAuth,
createUserWithEmailAndPassword,
signInWithEmailAndPassword,
signOut,
onAuthStateChanged
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-auth.js";

import {
getFirestore,
doc,
setDoc,
getDoc,
updateDoc,
collection,
query,
orderBy,
limit,
getDocs
}
from "https://www.gstatic.com/firebasejs/12.12.1/firebase-firestore.js";

/* CONFIG */

const firebaseConfig = {
apiKey: "AIzaSyDqz49BhXp6Q_Z7en5oLc7_W3Yz2UtTF74",
authDomain: "top10th-f8fd5.firebaseapp.com",
projectId: "top10th-f8fd5",
storageBucket: "top10th-f8fd5.firebasestorage.app",
messagingSenderId: "333453848720",
appId: "1:333453848720:web:29a45710bbd183d511a815",
measurementId: "G-X5YZT1WVLQ"
};

const app = initializeApp(firebaseConfig);

const auth = getAuth(app);

const db = getFirestore(app);

/* VARIABLES */

let currentLanguage = "en";

let currentQuestion = 0;

let xp = 0;

let solved = 0;

let correct = 0;

let filteredQuestions = [];

/* LANGUAGE */

document.getElementById("languageToggle")
.addEventListener("change",(e)=>{

currentLanguage = e.target.value;

loadQuestion();

});

/* QUESTIONS */

const questions = [

/* MATH */

{
subject:"Math",
question_en:"What is π value?",
question_hi:"π का मान क्या है?",
options_en:["2.14","3.14","4.14","5.14"],
options_hi:["2.14","3.14","4.14","5.14"],
answer:"3.14"
},

{
subject:"Math",
question_en:"5 × 5 = ?",
question_hi:"5 × 5 कितना होता है?",
options_en:["10","15","20","25"],
options_hi:["10","15","20","25"],
answer:"25"
},

{
subject:"Math",
question_en:"Square root of 81?",
question_hi:"81 का वर्गमूल क्या है?",
options_en:["7","8","9","10"],
options_hi:["7","8","9","10"],
answer:"9"
},

{
subject:"Math",
question_en:"12 ÷ 3 = ?",
question_hi:"12 ÷ 3 कितना होता है?",
options_en:["2","3","4","5"],
options_hi:["2","3","4","5"],
answer:"4"
},

{
subject:"Math",
question_en:"50% of 200?",
question_hi:"200 का 50% कितना है?",
options_en:["50","100","150","200"],
options_hi:["50","100","150","200"],
answer:"100"
},

/* SCIENCE */

{
subject:"Science",
question_en:"Formula of water?",
question_hi:"पानी का सूत्र क्या है?",
options_en:["H2O","CO2","O2","NaCl"],
options_hi:["H2O","CO2","O2","NaCl"],
answer:"H2O"
},

{
subject:"Science",
question_en:"Sun is a?",
question_hi:"सूर्य क्या है?",
options_en:["Planet","Star","Moon","Satellite"],
options_hi:["ग्रह","तारा","चंद्रमा","उपग्रह"],
answer:"Star"
},

{
subject:"Science",
question_en:"Plants absorb?",
question_hi:"पौधे क्या लेते हैं?",
options_en:["Oxygen","Carbon Dioxide","Hydrogen","Nitrogen"],
options_hi:["ऑक्सीजन","कार्बन डाइऑक्साइड","हाइड्रोजन","नाइट्रोजन"],
answer:"Carbon Dioxide"
},

{
subject:"Science",
question_en:"Human heart chambers?",
question_hi:"मानव हृदय में कितने कक्ष होते हैं?",
options_en:["2","3","4","5"],
options_hi:["2","3","4","5"],
answer:"4"
},

{
subject:"Science",
question_en:"Boiling point of water?",
question_hi:"पानी का क्वथनांक क्या है?",
options_en:["50°C","100°C","150°C","200°C"],
options_hi:["50°C","100°C","150°C","200°C"],
answer:"100°C"
},

/* ENGLISH */

{
subject:"English",
question_en:"Synonym of Happy?",
question_hi:"Happy का समानार्थी शब्द क्या है?",
options_en:["Sad","Joyful","Weak","Angry"],
options_hi:["उदास","खुश","कमज़ोर","गुस्सा"],
answer:"Joyful"
},

{
subject:"English",
question_en:"Past tense of Go?",
question_hi:"Go का past tense क्या है?",
options_en:["Goed","Gone","Went","Going"],
options_hi:["Goed","Gone","Went","Going"],
answer:"Went"
},

{
subject:"English",
question_en:"Choose noun.",
question_hi:"संज्ञा चुनें।",
options_en:["Run","School","Quickly","Beautiful"],
options_hi:["Run","School","Quickly","Beautiful"],
answer:"School"
},

{
subject:"English",
question_en:"Antonym of Big?",
question_hi:"Big का विलोम शब्द?",
options_en:["Huge","Large","Small","Tall"],
options_hi:["विशाल","बड़ा","छोटा","लंबा"],
answer:"Small"
},

{
subject:"English",
question_en:"Correct spelling?",
question_hi:"सही spelling चुनें।",
options_en:["Beautifull","Beautiful","Beatiful","Beautifal"],
options_hi:["Beautifull","Beautiful","Beatiful","Beautifal"],
answer:"Beautiful"
}

];

/* DUPLICATE TO 75 */

while(questions.length < 75){

questions.push(...questions.slice(0,5));

}

filteredQuestions = [...questions];

/* SIGNUP */

window.signup = async function(){

const name =
document.getElementById("name").value;

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

const res =
await createUserWithEmailAndPassword(
auth,
email,
password
);

await setDoc(doc(db,"users",res.user.uid),{

name,
xp:0,
solved:0,
correct:0,
streak:1

});

alert("Account Created");

}catch(err){

alert(err.message);

}

}

/* LOGIN */

window.login = async function(){

const email =
document.getElementById("email").value;

const password =
document.getElementById("password").value;

try{

await signInWithEmailAndPassword(
auth,
email,
password
);

}catch(err){

alert(err.message);

}

}

/* LOGOUT */

window.logout = async function(){

await signOut(auth);

}

/* AUTH STATE */

onAuthStateChanged(auth, async(user)=>{

if(user){

document.getElementById("authSection")
.classList.add("hidden");

document.getElementById("app")
.classList.remove("hidden");

const snap =
await getDoc(doc(db,"users",user.uid));

const data = snap.data();

xp = data.xp || 0;

solved = data.solved || 0;

correct = data.correct || 0;

updateUI(data);

loadQuestion();

loadLeaderboard();

}else{

document.getElementById("authSection")
.classList.remove("hidden");

document.getElementById("app")
.classList.add("hidden");

}

});

/* UPDATE UI */

function updateUI(data){

const accuracy =
solved === 0
? 0
: Math.floor((correct/solved)*100);

document.getElementById("navUser")
.innerText = data.name;

document.getElementById("xp")
.innerText = xp;

document.getElementById("solved")
.innerText = solved;

document.getElementById("accuracy")
.innerText = accuracy + "%";

document.getElementById("streak")
.innerText = data.streak + " 🔥";

}

/* LOAD QUESTION */

function loadQuestion(){

if(currentQuestion >= filteredQuestions.length){

alert("Quiz Completed");

currentQuestion = 0;

}

const q = filteredQuestions[currentQuestion];

const question =
currentLanguage === "hi"
? q.question_hi
: q.question_en;

const options =
currentLanguage === "hi"
? q.options_hi
: q.options_en;

document.getElementById("questionText")
.innerText = question;

document.getElementById("questionCount")
.innerText =
`Question ${currentQuestion+1}/${filteredQuestions.length}`;

document.getElementById("questionProgress")
.style.width =
`${((currentQuestion+1)/filteredQuestions.length)*100}%`;

const answers =
document.getElementById("answers");

answers.innerHTML = "";

options.forEach((option,index)=>{

const div =
document.createElement("div");

div.className =
"answer glass p-5 rounded-2xl";

div.innerText = option;

div.onclick = ()=>{

checkAnswer(q.options_en[index]);

};

answers.appendChild(div);

});

}

/* CHECK ANSWER */

async function checkAnswer(answer){

const q = filteredQuestions[currentQuestion];

solved++;

if(answer === q.answer){

xp += 10;

correct++;

alert("Correct ✅");

}else{

xp -= 2;

if(xp < 0){
xp = 0;
}

alert("Wrong ❌");

}

const user = auth.currentUser;

await updateDoc(doc(db,"users",user.uid),{

xp,
solved,
correct

});

updateUI({
name:user.email,
streak:1
});

currentQuestion++;

loadQuestion();

loadLeaderboard();

}

/* FILTER */

window.filterQuestions = function(subject){

if(subject === "All"){

filteredQuestions = [...questions];

}else{

filteredQuestions =
questions.filter(q=>q.subject===subject);

}

currentQuestion = 0;

loadQuestion();

}

/* LEADERBOARD */

async function loadLeaderboard(){

const leaderboard =
document.getElementById("leaderboard");

leaderboard.innerHTML = "";

const q =
query(
collection(db,"users"),
orderBy("xp","desc"),
limit(10)
);

const querySnapshot =
await getDocs(q);

let rank = 1;

querySnapshot.forEach((docSnap)=>{

const user = docSnap.data();

leaderboard.innerHTML += `

<div class="glass rounded-3xl p-6 flex justify-between items-center">

<div class="flex items-center gap-4">

<div class="w-14 h-14 rounded-full bg-white text-black flex items-center justify-center font-bold">
${rank}
</div>

<div>

<h2 class="font-bold text-xl">
${user.name}
</h2>

<p class="text-gray-400">
XP ${user.xp}
</p>

</div>

</div>

<div class="text-2xl">
🏆
</div>

</div>

`;

rank++;

});

}

/* TIMER */

let time = 30;

setInterval(()=>{

const timer =
document.getElementById("timer");

if(timer){

time--;

timer.innerText = time;

if(time <= 0){

time = 30;

currentQuestion++;

loadQuestion();

}

}

},1000);

</script>

</body>
  </html>
